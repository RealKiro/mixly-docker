# 可选：GitHub Actions 自动构建推送
# 轻镜像不含官方运行包，仓库无大文件，CI 可直接构建
name: docker-publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mixly-server
  DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mixly-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
