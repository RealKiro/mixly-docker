# 可选：GitHub Actions 自动构建推送
# 轻镜像不含官方运行包，仓库无大文件，CI 可直接构建
# GHCR 开箱即用（自动 GITHUB_TOKEN）；Docker Hub 需在仓库
# Settings -> Secrets and variables -> Actions 配置：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（未配置则自动跳过 Docker Hub 推送）
#
# 注意：secrets 上下文不能直接用于 if 表达式（会报 Unrecognized named-value），
#       必须先映射到 workflow 级 env，再用 env 判断。
name: docker-publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mixly-server
  DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 阶段在 qemu 下构建（仅 apk add，耗时可控）
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/loong64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/loong64
          push: true
          tags: |
            ${{ env.DH_USERNAME }}/mixly-server:latest
            ${{ env.DH_USERNAME }}/mixly-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
