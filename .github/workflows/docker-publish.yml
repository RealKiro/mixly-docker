# 可选：GitHub Actions 自动构建推送（需将 mixly_server 提交进仓库，
# 或改为在 CI 中从官方渠道下载解压；单个文件最大 100MB，mixio 二进制 145MB
# 需用 Git LFS 或 CI 下载方式，故推荐使用本地 build-push.sh 推送）
name: docker-publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mixly-server
  DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mixly-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./官方解压包/mixly_server
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
