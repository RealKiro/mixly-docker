# CI 流水线：测试 -> 跨架构构建检查 -> 推送
# - PR / 推送 main：仅跑冒烟测试 + arm64/loong64 构建检查（不推送）
# - 推送 v* 标签 / 手动触发：测试全部通过后构建三架构并推送 GHCR / Docker Hub
#   （GHCR 用自带 GITHUB_TOKEN；Docker Hub 需配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN，
#    secrets 不能用于 if 表达式，故先映射到 env 再判断）
name: docker-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mixly-server
  DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  test:
    name: 冒烟测试 (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建测试镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mixly-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 运行冒烟测试（缺包指引 / 架构校验 / 非 root 启动链路 / 镜像元数据）
        run: bash test/smoke-test.sh mixly-server:test

  cross-build:
    name: 跨架构构建检查 (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, loong64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 构建（不推送，验证可编译性）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: 推送 GHCR / Docker Hub
    needs: [test, cross-build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/loong64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/loong64
          push: true
          tags: |
            ${{ env.DH_USERNAME }}/mixly-server:latest
            ${{ env.DH_USERNAME }}/mixly-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
