# CI 流水线：测试 -> 跨架构构建检查 -> 按架构构建推送 -> manifest 合并
# - PR / 推送 main：仅跑冒烟测试 + arm64/loong64 构建检查（不推送）
# - 推送 v* 标签 / 手动触发：测试全部通过后按架构分别构建并推送，
#   再合并为多架构 manifest（Docker Hub 官方 alpine 无 loong64，
#   loong64 腿使用社区镜像 ghcr.io/loong64/alpine，见 Dockerfile BASE_IMAGE）
# - GHCR 用自带 GITHUB_TOKEN；Docker Hub 需配置 DOCKERHUB_USERNAME/
#   DOCKERHUB_TOKEN（secrets 不能用于 if 表达式，先映射到 env 再判断）
name: docker-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mixly-server
  DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  test:
    name: 冒烟测试 (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建测试镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mixly-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 运行冒烟测试（缺包指引 / 架构校验 / 非 root 启动链路 / 镜像元数据）
        run: bash test/smoke-test.sh mixly-server:test

  cross-build:
    name: 跨架构构建检查 (${{ matrix.pair }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: arm64
            platform: linux/arm64
            base: alpine:3
          - pair: loong64
            platform: linux/loong64
            base: ghcr.io/loong64/alpine:3
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 构建（不推送，验证可编译性）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-images:
    name: 推送单架构镜像 (${{ matrix.pair }})
    needs: [test, cross-build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: amd64
            platform: linux/amd64
            base: alpine:3
          - pair: arm64
            platform: linux/arm64
            base: alpine:3
          - pair: loong64
            platform: linux/loong64
            base: ghcr.io/loong64/alpine:3
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 镜像名转小写（Docker 仓库名不允许大写字母）
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mixly-server" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: Push 单架构镜像到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_IMAGE }}:latest-${{ matrix.pair }}
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-${{ matrix.pair }}

      - name: Push 单架构镜像到 Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          push: true
          provenance: false
          tags: |
            ${{ env.DH_USERNAME }}/mixly-server:latest-${{ matrix.pair }}
            ${{ env.DH_USERNAME }}/mixly-server:${{ github.ref_name }}-${{ matrix.pair }}

  manifest:
    name: 合并多架构 manifest
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 镜像名转小写（Docker 仓库名不允许大写字母）
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mixly-server" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: 合并并推送 GHCR 多架构 manifest
        run: |
          for TAG in latest "${{ github.ref_name }}"; do
            docker manifest create "${{ env.GHCR_IMAGE }}:${TAG}" \
              --amend "${{ env.GHCR_IMAGE }}:${TAG}-amd64" \
              --amend "${{ env.GHCR_IMAGE }}:${TAG}-arm64" \
              --amend "${{ env.GHCR_IMAGE }}:${TAG}-loong64"
            docker manifest push "${{ env.GHCR_IMAGE }}:${TAG}"
          done

      - name: 合并并推送 Docker Hub 多架构 manifest (未配置 Secrets 时自动跳过)
        if: ${{ env.DH_USERNAME != '' }}
        run: |
          for TAG in latest "${{ github.ref_name }}"; do
            docker manifest create "${{ env.DH_USERNAME }}/mixly-server:${TAG}" \
              --amend "${{ env.DH_USERNAME }}/mixly-server:${TAG}-amd64" \
              --amend "${{ env.DH_USERNAME }}/mixly-server:${TAG}-arm64" \
              --amend "${{ env.DH_USERNAME }}/mixly-server:${TAG}-loong64"
            docker manifest push "${{ env.DH_USERNAME }}/mixly-server:${TAG}"
          done
