# Mixly 4.0（MixSuite）离线服务端 - 群晖 NAS Docker Compose 部署
# 镜像只含运行环境（Debian + NW.js/X11 依赖 + Xvfb，约 300MB）；
# 官方 MixSuite 运行包需按机器架构下载解压后放入下方映射的 mixly_server 目录。
#
# Mixly 4.0 起官方唯一发行版 = MixSuite（内置 MixIO 的 MixlyServer，NW.js 应用）：
#   * 强制 HTTPS：HTTP(8080) 被官方固定关闭，请用 https://NAS_IP:8443 访问
#     （运行包自带自签证书，浏览器提示"连接不是专用连接"时点 高级→继续访问）
#   * 数据在映射目录的 mixio-app/ 下：storage(SQLite) / logs / config
#   * 管理员默认 admin/public，在 mixio-app/config/config.json 中修改
#
# 首次运行三步：
#   1. 建目录 /docker/mixly/mixly_server
#   2. 按机器架构从官方百度网盘下载 MixSuite-linux-<x64|arm64|loong64>.zip，
#      解压后把【里面的全部内容】（MixlyServer、.host/、mixio-app/、mixly/ 等）
#      放进上面目录
#   3. Container Manager 导入本文件并启动；之后浏览器访问 https://NAS_IP:8443
services:
  mixly:
    image: ghcr.io/realkiro/mixly-server:latest   # 多架构镜像，按 NAS 架构自动选择
    container_name: mixly-server
    restart: unless-stopped
    # NW.js 是完整 Chromium，共享内存不足会导致渲染进程异常退出
    # （容器反复重启、日志无应用层报错）。Docker 默认 /dev/shm 仅 64MB，
    # 这里放大到 1GB。docker run 等价写法：--shm-size=1g
    shm_size: '1gb'
    environment:
      - TZ=Asia/Shanghai
      # ── 管理后台入口（两种挂法，按反代能力选一种）──────────────────────────
      # 方案一「路径模式」：反代把 /admin(/.*)? 原样转发到 18084。
      #   只有支持按路径分流的入口才行 —— Nginx / cloudflared 的 config.yml。
      #   Cloudflare 面板（Zero Trust → 公共主机名）不支持路径，DSM 反向代理也不支持。
      - MIXIO_ADMIN_BASE=/admin
      # 方案二「子域名模式」：管理端单独一个子域名直接指到 18084。
      #   Cloudflare 面板隧道 / DSM 反代都能配；填了它，首页“管理后台”按钮就指向这里。
      #   与 MIXIO_ADMIN_BASE 共存也安全：请求带前缀则剥离、不带则原样通过。
      # ⚠️ 把域名换成你自己的；不打算用子域名就整行注释掉。
      - MIXIO_ADMIN_URL=https://admin.mixly.aino.fun/
      # 可选：端口覆盖（不设置则用官方默认 8443/1883/8083/8084/8082/8086。
      #        HTTP 端口被官方强制为 0，无法开启；改 HTTPS 为 443 需配合
      #       下方 cap_add: NET_BIND_SERVICE）
      # - MIXIO_HTTPS_PORT=8443
      # - MIXIO_MQTT_PORT=1883
      # - MIXIO_WS_PORT=8083
      # - MIXIO_WSS_PORT=8084
      # - MIXIO_YJS_PORT=8082
      # - MIXIO_YJS_WSS_PORT=8086
      # - MIXIO_DISABLE_NTP=1      # 不需要 NTP(123) 仿真时可禁用
    ports:
      - "8443:8443"     # MixIO HTTPS 主入口（MixSuite 强制 HTTPS）
      - "18084:18084"   # 管理模式（数据管理/用户导入/在线更新，默认 admin/public）
      - "1883:1883"     # MQTT
      - "8083:8083"     # WebSocket MQTT
      - "8084:8084"     # WSS MQTT
      - "8082:8082"     # Yjs 协同
      - "8086:8086"     # Yjs WSS
      # - "443:443"       # 配合 MIXIO_HTTPS_PORT=443 使用（需 cap_add）
      # - "123:123/udp"   # NTP 仿真（需 cap_add: NET_BIND_SERVICE）
    # 绑定 443/123 等特权端口时取消注释（容器内以非 root 运行，默认无需）：
    # cap_add:
    #   - NET_BIND_SERVICE
    # 烧录硬件（串口）时按需透传 USB 设备，并加入 dialout 组获得串口权限。
    # ⚠️ 按需开启：宿主机必须真实存在该设备节点，否则 Docker 直接报错
    #    "Error gathering device information while adding custom device ...: no such file or directory"
    #    并拒绝启动。没插开发板就保持注释状态；插了板子先 ls /dev/ttyUSB* /dev/ttyACM*
    #    确认真实设备名（部分芯片是 ttyACM0），群晖 DSM 还需在 Container Manager 允许 USB 访问。
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - dialout
    volumes:
      # 官方 MixSuite 运行包 + 全部数据（mixio-app/storage、logs、config、
      # user-data）都在这里，升级镜像不丢数据
      - ./mixly_server:/opt/mixly_server
