# Mixly 离线服务端 - 群晖 NAS Docker Compose 部署
# 镜像只含运行环境；官方运行包需自行放入下方映射的 mixly_server 目录。
#
# 首次运行三步：
#   1. 建目录 /docker/mixly/mixly_server
#   2. 从官方百度网盘下载 mixly_server 压缩包，解压后把内容（mixio/ mixly/ mixco/）
#      放进上面目录
#   3. Container Manager 导入本文件并启动；之后浏览器访问 http://NAS_IP:8080
services:
  mixly:
    image: ghcr.io/RealKiro/mixly-server:latest   # 多架构镜像，按 NAS 架构自动选择
    container_name: mixly-server
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"     # MixIO HTTP（官方默认端口）
      - "8443:8443"     # MixIO HTTPS 主页面
      - "18084:18084"   # 管理模式（数据管理/用户导入/手动更新，默认 admin/public）
      - "1883:1883"     # MQTT
      - "8083:8083"     # WebSocket MQTT
      - "8084:8084"     # WSS MQTT
      - "8082:8082"     # Yjs 协同
      - "8086:8086"     # Yjs WSS
      # - "443:443"     # 如需直连 443 再放开（群晖自身常占用 443）
    volumes:
      # 官方运行包 + 全部数据（storage/store/logs/config）都在这里，升级镜像不丢数据
      - ./mixly_server:/opt/mixly_server
